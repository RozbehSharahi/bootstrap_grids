name: GitHub Actions | Pipeline
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  coding-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check PHP coding style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        typo3: ["12", "13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json, zip, curl, pdo_sqlite
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          if [ "${{ matrix.typo3 }}" = "12" ]; then
            composer update --no-interaction --prefer-dist --no-progress --no-scripts --no-blocking --with-all-dependencies \
              --with="typo3/cms-core:^12.4" \
              --with="gridelementsteam/gridelements:^12.1"
          else
            composer update --no-interaction --prefer-dist --no-progress --no-scripts --with-all-dependencies \
              --with="typo3/cms-core:^13.4.7" \
              --with="gridelementsteam/gridelements:^13.0"
          fi

      - name: Audit supported dependencies
        if: matrix.typo3 == '13'
        run: composer audit --locked --abandoned=report

      - name: Lint PHP files
        run: git ls-files '*.php' | xargs -r -n1 php -l

      - name: Run unit tests
        run: vendor/bin/phpunit

      - name: Run functional tests
        run: vendor/bin/phpunit -c phpunit.functional.xml.dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, coding-style]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TYPO3_EXTENSION_KEY: bootstrap_grids
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$REF_NAME" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Invalid tag '${REF_NAME}'. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Get version
        id: get-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get comment
        id: get-comment
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          comment=$(git tag -n10 -l "v${VERSION}" | sed "s/^[0-9.]*[ ]*//g")

          if [[ -z "${comment// }" ]]; then
            comment="Released version ${VERSION} of ${TYPO3_EXTENSION_KEY}"
          fi

          delimiter=$(openssl rand -hex 16)
          {
            echo "comment<<${delimiter}"
            echo "$comment"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Check extension version
        env:
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          manifest_version=$(php -r '
              $_EXTKEY = getenv("TYPO3_EXTENSION_KEY");
              require "ext_emconf.php";
              echo $EM_CONF[$_EXTKEY]["version"] ?? "";
          ')

          if [[ "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag version ${RELEASE_VERSION} does not match ext_emconf.php version ${manifest_version}."
            exit 1
          fi

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        env:
          RELEASE_COMMENT: ${{ steps.get-comment.outputs.comment }}
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment "$RELEASE_COMMENT" "$RELEASE_VERSION"
